<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>En Construcción</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)),
                  url('https://images.unsplash.com/photo-1507699622108-4be3abd695ad');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 40px;
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      animation: fadeIn 1.5s ease;
    }

    .cross {
      font-size: 50px;
      margin-bottom: 20px;
      animation: float 3s infinite ease-in-out;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .verse {
      font-style: italic;
      font-size: 0.95rem;
      opacity: 0.7;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      border-radius: 30px;
      background: #d4af37;
      color: black;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    .btn:hover {
      background: #fff;
      color: #000;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="cross">✝</div>

    <h1>Estamos en construcción</h1>
    <p>Pronto tendremos un espacio digital lleno de fe, esperanza y comunidad.</p>

    <a href="#" class="btn">Volver pronto</a>

    <div class="verse">
      “Todo lo puedo en Aquel que me fortalece” — Filipenses 4:13
    </div>
  </div>

  <footer>
    © 2026 Iglesia Católica
  </footer>

</body>
</html>
